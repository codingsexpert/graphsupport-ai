[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphsupport-ai"
version = "0.1.0"
description = "Context-aware customer support agent powered by Neo4j and LLMs"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "GraphSupport Team" }
]
license = { text = "Proprietary" }
keywords = ["neo4j", "llm", "knowledge-graph", "customer-support", "streamlit"]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
    "neo4j>=5.20.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["graphsupport"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "integration: live integration tests against external services",
]
